server {
    listen       8080;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Sirve la SPA de React: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend de Despachos
    location /api/despachos/ {
        proxy_pass         http://backend-despachos:8081/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Proxy hacia el backend de Ventas
    location /api/ventas/ {
        proxy_pass         http://backend-ventas:8080/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Logs en stderr/stdout para Docker
    access_log  /dev/stdout;
    error_log   /dev/stderr warn;
}
