name: CI/CD — Frontend React (ECS)

# build → push (ECR) → deploy (ECS Fargate, detrás del ALB)
on:
  workflow_dispatch:
  push:
    branches: ["deploy"]
    paths:
      - "front_despacho/**"
      - ".github/workflows/cicd-frontend.yml"

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: innovatech-cluster
  ECS_SERVICE: innovatech-frontend
  CONTAINER_NAME: frontend
  TASK_FAMILY: innovatech-frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # ── TEST/BUILD: verifica que el frontend compila antes de la imagen ──
      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Test — Frontend (instala y compila)
        run: |
          cd front_despacho
          npm ci
          npm run build

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push — Frontend
        env:
          IMAGE: ${{ secrets.ECR_REPO_FRONTEND }}
        run: |
          cd front_despacho
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Descargar task definition actual
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query "taskDefinition" \
            | jq 'del(.taskDefinitionArn,.requiresAttributes,.compatibilities,.revision,.status,.registeredAt,.registeredBy,.deregisteredAt)' \
            > task-def.json

      - name: Renderizar nueva imagen en la task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.ECR_REPO_FRONTEND }}:${{ github.sha }}

      - name: Desplegar en ECS y esperar estabilidad
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
