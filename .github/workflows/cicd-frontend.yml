name: CI/CD — Frontend React

on:
  workflow_dispatch:
  push:
    branches: ["deploy"]
    paths:
      - "front_despacho/**"
      - ".github/workflows/cicd-frontend.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Autenticar con AWS
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # 3. Login en Amazon ECR
      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build y Push de la imagen Docker
      - name: Build y Push — Frontend
        run: |
          cd front_despacho
          docker build -t innovatech-frontend .
          docker tag innovatech-frontend:latest ${{ secrets.ECR_REPO_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_FRONTEND }}:latest

      # 5. Despliegue en EC2 Frontend (subred pública, acceso desde Internet) vía SSM
      - name: Desplegar en EC2 Frontend vía SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_FRONTEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy innovatech-frontend desde ECR" \
            --parameters commands='[
              "set -e",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_FRONTEND }}:latest",
              "docker stop innovatech-frontend || true",
              "docker rm   innovatech-frontend || true",
              "docker run -d --name innovatech-frontend --restart unless-stopped \
                -p 80:8080 \
                ${{ secrets.ECR_REPO_FRONTEND }}:latest"
            ]' \
            --output text
