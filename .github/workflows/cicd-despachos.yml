name: CI/CD — Backend Despachos (ECS)

# build → push (ECR) → deploy (ECS Fargate)
on:
  workflow_dispatch:
  push:
    branches: ["deploy"]
    paths:
      - "back-Despachos_SpringBoot/**"
      - ".github/workflows/cicd-despachos.yml"

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: innovatech-cluster
  ECS_SERVICE: innovatech-despachos
  CONTAINER_NAME: despachos
  TASK_FAMILY: innovatech-despachos

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # ── TEST: pruebas de contexto (H2) antes de construir ──
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test — Despachos (contexto con H2)
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          mvn -B test

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push — Despachos
        env:
          IMAGE: ${{ secrets.ECR_REPO_DESPACHOS }}
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Descargar task definition actual
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query "taskDefinition" \
            | jq 'del(.taskDefinitionArn,.requiresAttributes,.compatibilities,.revision,.status,.registeredAt,.registeredBy,.deregisteredAt)' \
            > task-def.json

      - name: Renderizar nueva imagen en la task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.ECR_REPO_DESPACHOS }}:${{ github.sha }}

      - name: Desplegar en ECS y esperar estabilidad
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
